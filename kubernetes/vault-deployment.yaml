apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: game-servers
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: vault:latest
        ports:
        - containerPort: 8200
        env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          value: "myroot"
        - name: VAULT_DEV_LISTEN_ADDRESS
          value: "0.0.0.0:8200"
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
        volumeMounts:
        - name: vault-file
          mountPath: /vault/file
      volumes:
      - name: vault-file
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: game-servers
spec:
  selector:
    app: vault
  ports:
  - port: 8200
    targetPort: 8200
  type: LoadBalancer