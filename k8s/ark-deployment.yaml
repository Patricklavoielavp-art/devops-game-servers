apiVersion: v1
kind: Secret
metadata:
  name: ark-secrets
type: Opaque
data:
  admin_password: <BASE64_ADMIN_PASSWORD>
  server_password: <BASE64_SERVER_PASSWORD>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ark-saves-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ark-config-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ark-backups-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ark-asa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ark-asa
  template:
    metadata:
      labels:
        app: ark-asa
    spec:
      containers:
        - name: ark-asa
          image: ark-asa:latest
          env:
            - name: ARK_MAP
              value: "TheIsland"
            - name: ARK_SESSION_NAME
              value: "K8s ARK Server"
            - name: ARK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ark-secrets
                  key: admin_password
            - name: ARK_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ark-secrets
                  key: server_password
            - name: ARK_GAME_PORT
              value: "7777"
            - name: ARK_QUERY_PORT
              value: "27015"
            - name: ARK_RCON_PORT
              value: "27020"
          ports:
            - containerPort: 7777
              protocol: UDP
            - containerPort: 27015
              protocol: UDP
            - containerPort: 27020
              protocol: TCP
          volumeMounts:
            - name: ark-saves
              mountPath: /opt/ark/ShooterGame/Saved
            - name: ark-config
              mountPath: /opt/ark/ShooterGame/Config
            - name: ark-backups
              mountPath: /opt/ark-backups
      volumes:
        - name: ark-saves
          persistentVolumeClaim:
            claimName: ark-saves-pvc
        - name: ark-config
          persistentVolumeClaim:
            claimName: ark-config-pvc
        - name: ark-backups
          persistentVolumeClaim:
            claimName: ark-backups-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ark-asa-svc
spec:
  type: NodePort
  selector:
    app: ark-asa
  ports:
    - name: game
      port: 7777
      protocol: UDP
      nodePort: 30077
    - name: query
      port: 27015
      protocol: UDP
      nodePort: 32015
    - name: rcon
      port: 27020
      protocol: TCP
      nodePort: 33020
