apiVersion: v1
kind: Secret
metadata:
  name: palworld-secrets
type: Opaque
data:
  admin_password: <BASE64_ADMIN_PASSWORD>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: palworld-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: palworld
spec:
  replicas: 1
  selector:
    matchLabels:
      app: palworld
  template:
    metadata:
      labels:
        app: palworld
    spec:
      containers:
        - name: palworld
          image: palworld:latest
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: palworld-secrets
                  key: admin_password
          ports:
            - containerPort: 7777
              protocol: UDP
          volumeMounts:
            - name: palworld-data
              mountPath: /opt/palworld/data
      volumes:
        - name: palworld-data
          persistentVolumeClaim:
            claimName: palworld-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: palworld-svc
spec:
  type: NodePort
  selector:
    app: palworld
  ports:
    - name: game
      port: 7777
      protocol: UDP
      nodePort: 30177
