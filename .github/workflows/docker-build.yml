name: Docker Build & Push

on: 
  push:
    branches: [ main,master  ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main,master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gane-server-bootstrap

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write


    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build game-server-image
        uses: docker/build-push-action@v3
        with:
          context: ./game-server-bootstrap
          file: ./game-server-bootstrap/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}          

      - name: Build linux-base image
        uses: docker/build-push-action@v4
        with:
          context: ./linux-bootstrap
          file: ./linux-bootstrap/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/linux-base:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/linux-base:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}