name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-shell:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: |
          echo "Running shellcheck on .sh files"
          find . -name '*.sh' -not -path './.github/*' -print0 | xargs -0 shellcheck

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.7'
      - name: Terraform fmt (check)
        working-directory: game-server-bootstrap/terraform
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: game-server-bootstrap/terraform
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: game-server-bootstrap/terraform
        run: terraform validate

  lint-ps:
    name: PowerShell script lint (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Write-Host "Running PSScriptAnalyzer on .ps1 files"
          $scripts = Get-ChildItem -Recurse -Filter *.ps1
          $exitCode = 0
          foreach ($s in $scripts) {
            Invoke-ScriptAnalyzer -Path $s.FullName -Recurse -Severity Error
            if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
          }
          exit $exitCode
