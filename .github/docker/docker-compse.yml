

version: "3.9"

services:
  ark-asa:
    image: ark-asa:latest
    build: .
    container_name: ark-asa
    restart: unless-stopped

    environment:
      ARK_HOME: /opt/ark
      ARK_MAP: TheIsland
      ARK_SESSION_NAME: "ARK Docker Server"
      ARK_ADMIN_PASSWORD: "change-me-admin"
      ARK_SERVER_PASSWORD: ""
      ARK_GAME_PORT: 7777
      ARK_QUERY_PORT: 27015
      ARK_RCON_PORT: 27020

    ports:
      - "7777:7777/udp"
      - "27015:27015/udp"
      - "27020:27020/tcp"

    volumes:
      - ark-saves:/opt/ark/ShooterGame/Saved
      - ark-config:/opt/ark/ShooterGame/Config
      - ark-backups:/opt/ark-backups

    stop_grace_period: 2m