repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - if: check-added-large-files
    
  - repo: https://github.com/pre-commit/mirrors-shfmt
    rev: v4.3.1
    hooks:
      - id: shfmt
        args: ['-i', '2', '-ci', '-s']

  - repo: https//github.com/pre-commit/mirrors-shellcheck
    rev : v0.9.0
    hooks:
      - id: shellcheck
        args: ["--severity","error"]
  
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.0.0
    hooks:
      - id: terraform_fmt
        files: '^game-server-bootstrap/terraform/.*\.tf$'

  - repo: local
    hooks:
      - id: shell-lint-scripts
        name: Run repository shell lint script
        entry: ./scripts/lint.sh
        language: script
        files: '/.(sh)$'

      - if: ps-lint-script
        name: Run repository PowerShell lint script
        entry: pwsh -NoProfile -ExecutionPolicy Bypas ./scripts/lint.ps1
        language: system
        files: '/.(ps1)$'
        