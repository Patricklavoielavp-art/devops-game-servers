replicaCount: 2

image:
  repository: ghcr.io/Patricklavoielavp-art/devops-game-servers/game-server
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  gameport: 27015
  httpport: 8080

resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi
  
  config:
    servername: "DevOps Game Server"
    maxplayers: "32"